[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-drug-response"
version = "2.0.0"
description = "Multimodal Deep Learning for Glioblastoma Drug Response Prediction and OOD Generalization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "rdkit>=2023.9.1",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
