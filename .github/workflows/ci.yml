name: Healthcare AI Pipeline CI & LecTrace Pages Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-audit:
    name: Unit Tests (incl. LecTrace) & Anti-Leakage Pipeline Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib pytest rdkit lectrace
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run automated unit test suite (pytest)
        run: |
          pytest -v

      - name: Run end-to-end synthetic pipeline validation & leakage audit
        run: |
          python scripts/06_validate_pipeline.py

  deploy-lectrace-pages:
    name: Build & Deploy Showcase + LecTrace to /docs & GitHub Pages
    needs: test-and-audit
    if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Lectrace CLI & Build Static Site into docs/
        run: |
          python -m pip install --upgrade pip
          pip install lectrace
          mkdir -p docs/lectrace docs/Latex_report
          if [ -f index.html ]; then cp index.html docs/index.html; fi
          if [ -f Latex_report/gbm_neurips_report.pdf ]; then
            cp Latex_report/gbm_neurips_report.pdf docs/Latex_report/gbm_neurips_report.pdf
            cp Latex_report/gbm_neurips_report.pdf docs/gbm_neurips_report.pdf
          fi
          test -f docs/index.html
          sed -i "s|__GITHUB_REPO_URL__|https://github.com/${{ github.repository }}|g" docs/index.html
          lectrace build Lectrace/01_gbm_ood_presentation.py --output docs/lectrace --no-incremental
          touch docs/.nojekyll
          test -f docs/lectrace/index.html

      - name: Commit & Push Updated /docs Folder for Branch (/docs) GitHub Pages
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): build showcase index.html and LecTrace into /docs [skip ci]"
            git push
          fi
