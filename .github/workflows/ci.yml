name: Healthcare AI Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-audit:
    name: Unit Tests & Anti-Leakage Pipeline Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib pytest rdkit
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run automated unit test suite (pytest)
        run: |
          pytest -v

      - name: Run end-to-end synthetic pipeline validation & leakage audit
        run: |
          python scripts/06_validate_pipeline.py
