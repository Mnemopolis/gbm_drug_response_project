name: Healthcare AI Pipeline CI & LecTrace Pages Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-audit:
    name: Unit Tests (incl. LecTrace) & Anti-Leakage Pipeline Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib pytest rdkit lectrace
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run automated unit test suite (pytest)
        run: |
          pytest -v

      - name: Run end-to-end synthetic pipeline validation & leakage audit
        run: |
          python scripts/06_validate_pipeline.py

  deploy-lectrace-pages:
    name: Build & Deploy Showcase + LecTrace to GitHub Pages
    needs: test-and-audit
    if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Lectrace CLI & Build Static Site (Landing Page + LecTrace)
        run: |
          python -m pip install --upgrade pip
          pip install lectrace
          mkdir -p _site/lectrace
          cp index.html _site/index.html
          sed -i "s|__GITHUB_REPO_URL__|https://github.com/${{ github.repository }}|g" _site/index.html
          lectrace build Lectrace/01_gbm_ood_presentation.py --output _site/lectrace --no-incremental
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/lectrace/index.html

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
